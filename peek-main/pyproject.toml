[project]
name = "peek-ai"
version = "0.1.0"
description = "PEEK: Context Map as an Orientation Cache for Long-Context LLM Agents."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Zhuohan Gu", email = "zgu15@mit.edu" },
    { name = "Qizheng Zhang" },
    { name = "Omar Khattab", email = "okhattab@mit.edu" },
    { name = "Samuel Madden", email = "madden@csail.mit.edu" },
]
keywords = ["llm", "agents", "long-context", "context-engineering", "cache"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40.0"]
anthropic = ["anthropic>=0.40.0"]
gemini = ["google-genai>=1.0.0"]
all = ["openai>=1.40.0", "anthropic>=0.40.0", "google-genai>=1.0.0"]
test = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://github.com/zhuohangu/peek"
Repository = "https://github.com/zhuohangu/peek"
Paper = "https://arxiv.org/abs/2510.04618"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
peek = ["prompts/*.txt"]
